<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Chatbot</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
            width: 100%;
        }

        .chatbox-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-right: 200px; /* Increase padding to make space for Bitmoji */
        }

        textarea, button {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        textarea {
            background-color: rgba(255, 255, 255, 0.85);
            color: #333;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
            height: 100px;
            resize: vertical;
        }

        textarea:focus {
            background-color: rgba(255, 255, 255, 1);
            outline: none;
        }

        button {
            background-color: #ff758c;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #ff5896;
        }

        .response {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            color: #fff;
            text-align: center;
        }

        .api-url {
            background-color: rgba(255, 255, 255, 0.85);
            color: #333;
        }

        .bitmoji {
            position: absolute;
            top: 0;
            right: -35px; /* Shift further to the right to prevent overlap */
            height: calc(100% + 60px); /* Match height and add extra space */
            width: auto; /* Maintain aspect ratio */
            z-index: 1; /* Ensure it's on top */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chatbox-container">
            <h1>Avinashsingh's Q&A Chatbot</h1>
            <input
                id="api-url"
                class="api-url"
                type="text"
                placeholder="Paste your ngrok URL, e.g. https://xxxx.ngrok-free.app"
            />
            <textarea id="question" placeholder="Ask a question..."></textarea>
            <button id="ask-btn">Ask</button>
            <div id="response" class="response"></div>
        </div>
        <img src="E:\MY PROJECTS\AVIGPT\WhatsApp_Image_2024-09-18_at_14.57.43_900fbcf1-removebg-preview.png" alt="Bitmoji" class="bitmoji" />
    </div>

    <script>
        const apiUrlInput = document.getElementById('api-url');
        apiUrlInput.value = localStorage.getItem('avigpt_api_base') || '';

        document.getElementById('ask-btn').addEventListener('click', async () => {
            const question = document.getElementById('question').value;
            const apiBase = apiUrlInput.value.trim();

            if (question.trim() === "") {
                alert("Please enter a question");
                return;
            }

            if (apiBase === "") {
                alert("Please paste your ngrok URL first");
                return;
            }

            localStorage.setItem('avigpt_api_base', apiBase);

            document.getElementById('response').innerText = "Generating answer...";

            try {
                const askUrl = `${apiBase.replace(/\/$/, '')}/ask`;
                const response = await fetch(askUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errText}`);
                }

                const data = await response.json();
                document.getElementById('response').innerText = data.answer;
            } catch (error) {
                document.getElementById('response').innerText = `Error fetching the answer: ${error.message}`;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
